apiVersion: v2
name: veeamon-tour
description: Small two-tier VeeamON Tour demo app (Flask frontend + MariaDB) used for the Kasten K10 AKS/EKS DR demo
type: application
version: 0.1.0
appVersion: "1.0.0"
# No Helm chart dependency for MariaDB - Bitnami's registry prunes old image
# tags on a schedule outside our control (confirmed: the chart's default
# image tag became unpullable between when this was built and the first
# real run). The MariaDB StatefulSet is self-authored in templates/ using
# the official docker.io/library/mariadb image instead, which isn't subject
# to that churn.
