apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "veeamon-tour.mariadbHost" . }}
  labels:
    app: {{ include "veeamon-tour.mariadbHost" . }}
spec:
  serviceName: {{ include "veeamon-tour.mariadbHost" . }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "veeamon-tour.mariadbHost" . }}
  template:
    metadata:
      labels:
        app: {{ include "veeamon-tour.mariadbHost" . }}
    spec:
      containers:
        - name: mariadb
          image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.auth.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.auth.username | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "veeamon-tour.mariadbHost" . }}
                  key: mariadb-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "veeamon-tour.mariadbHost" . }}
                  key: mariadb-root-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -uroot -p$MARIADB_ROOT_PASSWORD"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -uroot -p$MARIADB_ROOT_PASSWORD"]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mariadb.primary.persistence.size }}
