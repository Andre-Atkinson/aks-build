{{- $secretName := include "veeamon-tour.mariadbHost" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $rootPassword := .Values.mariadb.auth.rootPassword }}
{{- $appPassword := .Values.mariadb.auth.password }}
{{- if not $rootPassword }}
  {{- if $existing }}
    {{- $rootPassword = index $existing.data "mariadb-root-password" | b64dec }}
  {{- else }}
    {{- $rootPassword = randAlphaNum 20 }}
  {{- end }}
{{- end }}
{{- if not $appPassword }}
  {{- if $existing }}
    {{- $appPassword = index $existing.data "mariadb-password" | b64dec }}
  {{- else }}
    {{- $appPassword = randAlphaNum 20 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
stringData:
  mariadb-root-password: {{ $rootPassword | quote }}
  mariadb-password: {{ $appPassword | quote }}
