# Build and push app/veeamon-tour/frontend first, then point this at your registry.
# Use --platform linux/amd64 even on Apple Silicon - AKS/EKS nodes are
# x86_64, and a plain `docker build` here produces an arm64 image that fails
# with "exec format error" on the cluster (hit on a real run):
#   docker buildx build --platform linux/amd64 -t <registry>/veeamon-tour:latest \
#     --push app/veeamon-tour/frontend
image:
  repository: ""
  tag: "latest"
  # Always, not IfNotPresent: this project rebuilds and pushes the same
  # :latest tag repeatedly (no immutable digest pin), and IfNotPresent
  # caused a real failure - a node that already cached an older `latest`
  # under that name never re-pulled after a newer image was pushed, so it
  # kept running stale (in one case, wrong-architecture) content.
  pullPolicy: Always

replicaCount: 1

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

# auth.rootPassword / auth.password are intentionally left blank - the
# templates auto-generate random passwords (persisted in the <release>-mariadb
# Secret across upgrades) when unset. Override with --set if you want fixed
# values, e.g. from $MARIADB_ROOT_PASSWORD / $MARIADB_APP_PASSWORD.
mariadb:
  enabled: true
  image:
    repository: mariadb
    tag: "11"
  auth:
    database: "veeamon_tour"
    username: "veeamon"
    rootPassword: ""
    password: ""
  primary:
    persistence:
      size: 1Gi
